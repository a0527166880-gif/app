name: Build Offline APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download bundled offline OCR and compact translation model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models app/src/main/assets/tessdata
          HF="https://huggingface.co/huggingworld/m2m100_418M/resolve/main"
          curl -L --fail --retry 5 --retry-delay 3 -o app/src/main/assets/models/encoder_model_quantized.onnx "$HF/onnx/encoder_model_quantized.onnx"
          curl -L --fail --retry 5 --retry-delay 3 -o app/src/main/assets/models/decoder_model_quantized.onnx "$HF/onnx/decoder_model_quantized.onnx"
          curl -L --fail --retry 5 --retry-delay 3 -o app/src/main/assets/models/tokenizer.json "$HF/tokenizer.json"
          for lang in eng ara heb rus chi_sim; do
            curl -L --fail --retry 5 --retry-delay 3 -o "app/src/main/assets/tessdata/$lang.traineddata" "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata"
          done
      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK signing and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          stat -c '%n %s bytes' "$APK"
          cat "$APK.sha256"
      - name: Split APK only if it is still over the attachment limit
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c %s "$APK")
          mkdir -p app/build/outputs/apk/parts
          if [ "$SIZE" -gt 500000000 ]; then
            split -b 250M -d -a 2 "$APK" app/build/outputs/apk/parts/app-debug.apk.part-
          else
            cp "$APK" app/build/outputs/apk/parts/app-debug.apk
          fi
          ls -lh app/build/outputs/apk/parts
      - uses: actions/upload-artifact@v4
        with:
          name: LensTranslate-apk
          path: |
            app/build/outputs/apk/parts/*
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 90
